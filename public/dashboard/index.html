function TimeBadge({ active, onClick, children }) {

      onClick={onClick}
      className={`px-3 py-1.5 text-xs rounded-md transition-all duration-200 ${
        active
          ? 'bg-accent text-white shadow-lg shadow-accent/25'
          : 'bg-bg-card text-slate-400 hover:text-white hover:bg-bg-hover'

function TrendIcon({ direction, pct }) {
  if (direction === 'up') return <span className="text-success text-xs">↑ {pct}%</span>;
  if (direction === 'down') return <span className="text-danger text-xs">↓ {pct}%</span>;
  return <span className="text-slate-500 text-xs">→ {pct}%</span>;
}

function Sparkline({ data, width = 80, height = 24, color = '#6366f1' }) {
  const max = Math.max(...data);
  const min = Math.min(...data);
  const range = max - min || 1;
  const points = data.map((v, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((v - min) / range) * (height - 4) - 2;
    return `${x},${y}`;
  }).join(' ');
  return (
    <svg width={width} height={height} className="inline-block">
      <polyline points={points} fill="none" stroke={color} strokeWidth="1.5" className="sparkline-path" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function Top50Table() {
  const [filter, setFilter] = useState('all');
  const [search, setSearch] = useState('');
  const [timeRange, setTimeRange] = useState('today');
  const [sortKey, setSortKey] = useState('rank');
  const [sortDir, setSortDir] = useState('asc');

  const filtered = useMemo(() => {
    let data = [...TOP50];
    if (filter !== 'all') data = data.filter(d => d.category === filter);
    if (search) data = data.filter(d => d.keyword.toLowerCase().includes(search.toLowerCase()));
    if (sortKey === 'count') data.sort((a, b) => sortDir === 'asc' ? a.count - b.count : b.count - a.count);
    return data;
  }, [filter, search, sortKey, sortDir]);

  const handleSort = (key) => {
    if (sortKey === key) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortKey(key); setSortDir('asc'); }
  };

  const rankBadge = (rank) => {
    if (rank === 1) return 'bg-gradient-to-r from-yellow-500 to-amber-400 text-black';
    if (rank === 2) return 'bg-gradient-to-r from-slate-300 to-slate-400 text-black';
    if (rank === 3) return 'bg-gradient-to-r from-amber-600 to-amber-700 text-white';
    return 'bg-bg text-slate-400';
  };

  return (
    <div className="bg-bg-card rounded-xl p-6 border border-slate-700/50 animate-fade-in">
      <div className="flex items-center justify-between mb-5 flex-wrap gap-3">
        <SectionTitle id="sec-top50">实时热门搜索 Top50</SectionTitle>

          <option value="all">全部分类</option>

        </select>
        <input

          导出 Excel
        </button>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm">
          <thead>
            <tr className="text-slate-500 text-xs border-b border-slate-700/50">
              <th className="text-left py-3 px-2 w-16 cursor-pointer hover:text-slate-300" onClick={() => handleSort('rank')}>排名</th>

            <div style="color:#94a3b8">搜索量: <span style="color:#f1f5f9;font-weight:600;font-family:monospace">${p.data.count.toLocaleString()}</span></div>`;
        }
      },
      xAxis: { type: 'value', show: false, min: 73, max: 136 },
      yAxis: { type: 'value', show: false, min: 17, max: 54 },
      grid: { left: 20, right: 20, top: 10, bottom: 10 },
      series: [
        // Background glow
        {
          type: 'scatter',
          coordinateSystem: 'cartesian2d',
          symbol: 'circle',
          silent: true,
          data: CITIES.map(c => ({
            name: c.city,
            value: [...c.coords, c.count],
            itemStyle: {
              color: new echarts.graphic.RadialGradient(0.5, 0.5, 0.5, [
                { offset: 0, color: 'rgba(99,102,241,0.25)' },
                { offset: 1, color: 'rgba(99,102,241,0)' }
              ])
            },
            symbolSize: Math.sqrt(c.count) * 2.2,
          })),
          animationDuration: 2000,
          animationEasing: 'cubicOut',
          z: 1,
        },
        // Main bubbles
        {
          type: 'scatter',
          coordinateSystem: 'cartesian2d',
          symbol: 'circle',
          data: CITIES.map(c => {
            const isLeft = c.coords[0] < 110;
            return {
              name: c.city,
              value: [...c.coords, c.count],
              city: c.city,
              count: c.count,
              itemStyle: {
                color: new echarts.graphic.RadialGradient(0.5, 0.5, 0.5, [
                  { offset: 0, color: c.count > 15000 ? '#8b5cf6' : c.count > 10000 ? '#6366f1' : '#06b6d4' },
                  { offset: 1, color: c.count > 15000 ? 'rgba(139,92,246,0.4)' : c.count > 10000 ? 'rgba(99,102,241,0.4)' : 'rgba(6,182,212,0.4)' }
                ]),
                shadowBlur: 20,
                shadowColor: c.count > 15000 ? 'rgba(139,92,246,0.6)' : 'rgba(99,102,241,0.4)',
              },
              symbolSize: Math.sqrt(c.count) * 1.1,
              labelPos: isLeft ? 'left' : 'right',
            };
          }),
          label: {
            show: true,
            formatter: (p) => {
              const city = p.data.city;
              const count = p.data.count;
              return `{name|${city}}  {val|${(count / 1000).toFixed(1)}k}`;
            },
            rich: {
              name: { fontSize: 12, color: '#e2e8f0', fontWeight: 'bold', lineHeight: 16 },
              val: { fontSize: 10, color: '#94a3b8', lineHeight: 16 },
            },
            position: (p) => {
              const isLeft = p[0] < 110;
              return isLeft ? 'left' : 'right';
            },
            distance: 8,
          },
          animationDuration: 1500,
          animationEasing: 'elasticOut',
          z: 2,
        },
        // Pulse rings for top 3
        {
          type: 'effectScatter',
          coordinateSystem: 'cartesian2d',
          symbol: 'circle',
          data: CITIES.slice(0, 3).map(c => ({
            name: c.city,
            value: [...c.coords, c.count],
            city: c.city,
            count: c.count,
            itemStyle: { color: '#8b5cf6' },
            symbolSize: Math.sqrt(c.count) * 0.6,
          })),
          rippleEffect: { brushType: 'stroke', scale: 4, period: 4 },
          label: { show: false },
          z: 3,
        }
      ],
      graphic: [
        {
          type: 'text',
          left: 'center',
          bottom: 8,
          style: {
            text: '热门城市搜索热力分布',
            fill: '#475569',
            fontSize: 11,
          }
        }
      ]
    };
    mapInstance.current.setOption(option);
    mapInstance.current.on('click', (params) => {
      if (params.data && params.data.city) {
        setSelectedCity(CITIES.find(c => c.city === params.data.city));
      }
    });
    const handleResize = () => mapInstance.current?.resize();
    window.addEventListener('resize', handleResize);
    return () => { window.removeEventListener('resize', handleResize); mapInstance.current?.dispose(); };
  }, []);

  return (
    <div className="bg-bg-card rounded-xl p-6 border border-slate-700/50 animate-fade-in h-full">
      <div className="flex items-center justify-between mb-4">
        <SectionTitle id="sec-city">热门城市榜</SectionTitle>
        <div className="flex gap-2">
          {['today', '7d', '30d'].map(t => (
            <TimeBadge key={t} active={timeRange === t} onClick={() => setTimeRange(t)}>
              {{ today: '今日', '7d': '近7天', '30d': '近30天' }[t]}
            </TimeBadge>
          ))}
        </div>
      </div>
      <div className="h-80 mb-4 relative">
        <div ref={mapRef} className="w-full h-full rounded-lg"></div>
      </div>
      <div className="space-y-2">
        {CITIES.map(city => (
          <div
            key={city.city}
            onClick={() => setSelectedCity(selectedCity?.city === city.city ? null : city)}
            className={`flex items-center gap-3 p-2.5 rounded-lg cursor-pointer transition-all duration-200 ${
              selectedCity?.city === city.city ? 'bg-accent/10 border border-accent/50' : 'hover:bg-bg-hover/50 border border-transparent'
            }`}
          >
            <span className={`w-6 h-6 flex items-center justify-center rounded text-xs font-bold ${
              city.rank <= 3 ? 'bg-gradient-to-r from-accent to-purple text-white' : 'bg-bg text-slate-500'
            }`}>
              {city.rank}
            </span>
            <span className="text-sm text-white flex-1">{city.city}</span>
            <span className="text-sm font-mono text-slate-300">{city.count.toLocaleString()}</span>
          </div>
        ))}
      </div>
      {/* City detail popover */}
      {selectedCity && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50" onClick={() => setSelectedCity(null)}>
          <div className="bg-bg-card border border-slate-600 rounded-xl p-5 w-80 shadow-2xl animate-fade-in" onClick={e => e.stopPropagation()}>
            <div className="flex items-center justify-between mb-4">
              <h3 className="text-lg font-bold text-white">{selectedCity.city}</h3>
              <button onClick={() => setSelectedCity(null)} className="text-slate-400 hover:text-white">
                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" /></svg>
              </button>
            </div>
            <div className="text-sm text-slate-400 mb-3">总搜索量: <span className="text-white font-bold">{selectedCity.count.toLocaleString()}</span></div>
            <div className="space-y-2">
              {selectedCity.keywords.map(([kw, cnt], i) => (
                <div key={kw} className="flex justify-between items-center py-1.5 border-b border-slate-700/30 last:border-0">
                  <span className="text-sm text-slate-300"><span className="text-slate-500 mr-2">{i + 1}</span>{kw}</span>
                  <span className="text-sm text-slate-400 font-mono">{cnt.toLocaleString()}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ==================== AREA 5: INSIGHTS ====================

function DataInsights() {
  const [expanded, setExpanded] = useState(3);
  const [chartTab, setChartTab] = useState('trend');
  const trendChartRef = useRef(null);
  const stackChartRef = useRef(null);

  useEffect(() => {
    if (!trendChartRef.current) return;
    const chart = echarts.init(trendChartRef.current);
    const option = {
      tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } },
      legend: {
        data: CATEGORIES.map(c => c.name),
        textStyle: { color: '#94a3b8', fontSize: 10 },
        top: 0,
        type: 'scroll',
        pageTextStyle: { color: '#94a3b8' },
      },
      grid: { left: 40, right: 20, top: 40, bottom: 30 },
      xAxis: { type: 'category', data: TREND_7D.dates, axisLine: { lineStyle: { color: '#334155' } }, axisLabel: { color: '#94a3b8' } },
      yAxis: { type: 'value', splitLine: { lineStyle: { color: '#1e293b' } }, axisLabel: { color: '#94a3b8' } },
      series: CATEGORIES.map(cat => ({
        name: cat.name,
        type: 'line',
        data: TREND_7D[cat.name],
        smooth: true,
        symbol: 'circle',
        symbolSize: 4,
        lineStyle: { width: 2, color: cat.color },
        itemStyle: { color: cat.color },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
          { offset: 0, color: cat.color + '30' },
          { offset: 1, color: cat.color + '05' }
        ])},
      })),
    };
    chart.setOption(option);
    const handleResize = () => chart?.resize();
    window.addEventListener('resize', handleResize);
    return () => { window.removeEventListener('resize', handleResize); chart?.dispose(); };
  }, []);

  useEffect(() => {
    if (!stackChartRef.current) return;
    const chart = echarts.init(stackChartRef.current);
    const totalPerDay = TREND_7D.dates.map((_, i) =>
      CATEGORIES.reduce((sum, cat) => sum + (TREND_7D[cat.name]?.[i] || 0), 0)
    );
    const option = {
      tooltip: { trigger: 'axis', backgroundColor: '#1e293b', borderColor: '#334155', textStyle: { color: '#e2e8f0' } },
      legend: {
        data: CATEGORIES.map(c => c.name),
        textStyle: { color: '#94a3b8', fontSize: 10 },
        top: 0,
        type: 'scroll',
        pageTextStyle: { color: '#94a3b8' },
      },
      grid: { left: 40, right: 20, top: 40, bottom: 30 },
      xAxis: { type: 'category', data: TREND_7D.dates, axisLine: { lineStyle: { color: '#334155' } }, axisLabel: { color: '#94a3b8' } },
      yAxis: { type: 'value', max: 100, axisLabel: { color: '#94a3b8', formatter: '{value}%' }, splitLine: { lineStyle: { color: '#1e293b' } } },
      series: CATEGORIES.map(cat => ({
        name: cat.name,
        type: 'bar',
        stack: 'total',
        data: TREND_7D.dates.map((_, i) => {
          const val = TREND_7D[cat.name]?.[i] || 0;
          return +(val / totalPerDay[i] * 100).toFixed(1);
        }),
        itemStyle: { color: cat.color },
        barWidth: '60%',
      })),
    };
    chart.setOption(option);
    const handleResize = () => chart?.resize();
    window.addEventListener('resize', handleResize);
    return () => { window.removeEventListener('resize', handleResize); chart?.dispose(); };
  }, []);

  return (
    <div className="bg-bg-card rounded-xl p-6 border border-slate-700/50 animate-fade-in">
      <SectionTitle id="sec-insights">数据洞察</SectionTitle>
      <div className="flex gap-1 mb-4 bg-bg rounded-lg p-1 w-fit">
        {[['trend', '分类趋势'], ['stack', '占比变化']].map(([k, l]) => (
          <button
            key={k}
            onClick={() => setChartTab(k)}
            className={`px-4 py-2 text-xs rounded-md transition-all duration-200 ${
              chartTab === k ? 'bg-accent text-white shadow-md' : 'text-slate-400 hover:text-white'
            }`}
          >
            {l}
          </button>
        ))}
      </div>
      <div className="h-72 mb-6">
        <div ref={trendChartRef} className={`w-full h-full ${chartTab !== 'trend' ? 'hidden' : ''}`} />
        <div ref={stackChartRef} className={`w-full h-full ${chartTab !== 'stack' ? 'hidden' : ''}`} />
      </div>
      <div className="flex items-center justify-between mb-4">
        <h3 className="text-sm font-semibold text-slate-300">智能洞察</h3>
        <span className="text-xs text-slate-500">基于规则引擎自动生成</span>
      </div>
      <div className="space-y-3">
        {INSIGHTS.slice(0, expanded).map((ins, i) => (
          <div key={i} className="p-4 rounded-lg border border-slate-700/30 bg-bg/50 hover:border-slate-600 transition-all duration-200">
            <div className="flex items-start gap-3">
              <div className={`w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0 ${
                i < 3 ? 'bg-gradient-to-br from-accent to-purple' : 'bg-slate-700'
              }`}>
                <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
              </div>
              <div className="flex-1">
                <h4 className="text-sm font-semibold text-white mb-1">{ins.title}</h4>
                <p className="text-xs text-slate-400 leading-relaxed mb-2">{ins.content}</p>
                <div className="flex items-center gap-2 mb-2">
                  <svg className="w-3.5 h-3.5 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                  <span className="text-xs text-accent">{ins.action}</span>
                </div>
                <div className="flex gap-2 flex-wrap">
                  {ins.tags.map(tag => (
                    <span key={tag} className="text-xs px-2 py-0.5 rounded-full bg-accent/10 text-accent/80">{tag}</span>
                  ))}
                </div>
              </div>
            </div>
          </div>
        ))}
      </div>
      {expanded < INSIGHTS.length && (
        <button onClick={() => setExpanded(INSIGHTS.length)} className="w-full mt-3 py-2 text-xs text-slate-400 hover:text-white transition-colors">
          展开全部 {INSIGHTS.length} 条洞察 ↓
        </button>
      )}
      {expanded >= INSIGHTS.length && INSIGHTS.length > 3 && (
        <button onClick={() => setExpanded(3)} className="w-full mt-3 py-2 text-xs text-slate-400 hover:text-white transition-colors">
          收起 ↑
        </button>
      )}
    </div>
  );
}

// ==================== MAIN APP ====================

function App() {
  const [sidebarOpen, setSidebarOpen] = useState(false);
  const [lastUpdate, setLastUpdate] = useState(new Date());
  const [activeSection, setActiveSection] = useState('sec-overview');

  useEffect(() => {
    const timer = setInterval(() => setLastUpdate(new Date()), 300000);
    return () => clearInterval(timer);
  }, []);

  useEffect(() => {
    const observer = new IntersectionObserver(
      entries => {
        entries.forEach(entry => {
          if (entry.isIntersecting) setActiveSection(entry.target.id);
        });
      },
      { threshold: 0.3 }
    );
    ['sec-overview', 'sec-top50', 'sec-surge', 'sec-city', 'sec-insights'].forEach(id => {
      const el = document.getElementById(id);
      if (el) observer.observe(el);
    });
    return () => observer.disconnect();
  }, [sidebarOpen]);

  const scrollTo = (id) => {
    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
  };

  const navItems = [
    { id: 'sec-overview', label: '分类总览', icon: 'M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z' },
    { id: 'sec-top50', label: '热门 Top50', icon: 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6' },
    { id: 'sec-surge', label: '飙升榜', icon: 'M13 7h8m0 0v8m0-8l-8 8-4-4-6 6' },
    { id: 'sec-city', label: '热门城市', icon: 'M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z' },
    { id: 'sec-insights', label: '数据洞察', icon: 'M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z' },
  ];

  return (
    <div className="min-h-screen bg-bg flex">
      {/* Sidebar */}
      <div className={`fixed left-0 top-0 h-full bg-bg-card border-r border-slate-700/50 z-40 transition-all duration-300 ${
        sidebarOpen ? 'w-56 translate-x-0' : 'w-56 -translate-x-full'
      }`}>
        <div className="p-5 border-b border-slate-700/50">
          <div className="flex items-center gap-2">
            <div className="w-8 h-8 rounded-lg bg-gradient-to-br from-accent to-purple flex items-center justify-center">
              <svg className="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
              </svg>
            </div>
            <span className="text-sm font-bold text-white">搜索数据看板</span>
          </div>
        </div>
        <nav className="p-3 space-y-1">
          {navItems.map(item => (
            <button
              key={item.id}
              onClick={() => { scrollTo(item.id); }}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm transition-all duration-200 ${
                activeSection === item.id
                  ? 'bg-accent/15 text-accent'
                  : 'text-slate-400 hover:text-white hover:bg-bg-hover/50'
              }`}
            >
              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d={item.icon} />
              </svg>
              {item.label}
            </button>
          ))}
        </nav>
      </div>

      {/* Main content */}
      <div className={`flex-1 transition-all duration-300 ${sidebarOpen ? 'ml-56' : 'ml-0'}`}>
        {/* Header */}
        <header className="sticky top-0 z-30 bg-bg/80 backdrop-blur-xl border-b border-slate-700/30">
          <div className="flex items-center justify-between px-6 py-4">
            <div className="flex items-center gap-4">
              <button
                onClick={() => setSidebarOpen(!sidebarOpen)}
                className="p-2 rounded-lg bg-bg-card border border-slate-700/50 text-slate-400 hover:text-white hover:border-accent/50 transition-all duration-200"
                title={sidebarOpen ? '收起侧边栏' : '展开侧边栏'}
              >
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  {sidebarOpen
                    ? <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                    : <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6h16M4 12h16M4 18h16" />
                  }
                </svg>
              </button>
              <div>
                <h1 className="text-xl font-bold text-white">东航搜索数据智能看板</h1>
                <p className="text-xs text-slate-500 mt-0.5">
                  最后更新: {lastUpdate.toLocaleTimeString('zh-CN')} · 数据延迟 ≤ 5分钟
                </p>
              </div>
            </div>
            <div className="flex items-center gap-3">
              <div className="flex items-center gap-1.5">
                <div className="w-2 h-2 rounded-full bg-success animate-pulse"></div>
                <span className="text-xs text-slate-400">实时</span>
              </div>
            </div>
          </div>
        </header>

        {/* Content */}
        <main className="p-6 space-y-6 max-w-[1600px] mx-auto">
          <CategoryOverview />
          <Top50Table />
          <div className="grid grid-cols-1 xl:grid-cols-2 gap-6">
            <SurgeBoard />
            <CityRank />
          </div>
          <DataInsights />
        </main>

        {/* Footer */}
        <footer className="px-6 py-4 border-t border-slate-700/30 text-center">
          <p className="text-xs text-slate-600">东航APP搜索数据智能看板 · 数据仅供内部参考</p>
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
